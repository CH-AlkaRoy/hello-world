# Benefit Search Test Suite Configuration
# This file contains environment-specific configuration for test execution

# Application URL
base.url=https://benefits.collectivehealth.com

# Browser Configuration
browser=chrome
# Supported browsers: chrome, firefox, edge, safari

# Wait Times (in seconds)
implicit.wait=10
explicit.wait=30
page.load.timeout=60

# Test Data
default.username=testuser@collectivehealth.com
default.password=SecurePassword123!

# Reporting
screenshot.on.failure=true
report.output.directory=target/test-reports

# Logging Level
log.level=INFO
# Options: TRACE, DEBUG, INFO, WARN, ERROR

# Retry Configuration
max.retry.count=2
retry.delay.seconds=5

# Environment
test.environment=staging
# Options: local, dev, staging, production
